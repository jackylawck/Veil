<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>揭帷 The Veil | 官方 UAP 披露進程與數據追蹤器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            obsidian: '#0b0f17',
            surface: '#151c28',
            surfaceBorder: '#232f42',
            accent: '#38bdf8'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .timeline-line::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 19px;
      width: 2px;
      background: #232f42;
    }
  </style>
</head>
<body class="bg-obsidian text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-sky-500 selection:text-white">

  <!-- 頂部導航欄 -->
  <header class="border-b border-surfaceBorder bg-surface/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold tracking-wider text-white">THE VEIL <span class="text-sky-400 font-light">| 揭帷</span></span>
        <span class="text-xs bg-sky-950 text-sky-400 border border-sky-800 px-2 py-0.5 rounded-full uppercase tracking-wider">Audit Grade</span>
      </div>
      <div class="flex items-center space-x-4">
        <!-- 語言切換按鈕 -->
        <button id="langToggleBtn" onclick="toggleLanguage()" class="text-xs font-semibold px-3 py-1.5 rounded-lg border border-surfaceBorder hover:border-sky-400 transition bg-surface text-slate-300">
          EN / 中文
        </button>
        <a href="https://github.com/jackylawck/veil" target="_blank" class="text-slate-400 hover:text-white transition text-lg" title="GitHub Repository">
          <i class="fa-brands fa-github"></i>
        </a>
      </div>
    </div>
  </header>

  <!-- 首頁 Header 氛圍區 -->
  <section class="max-w-5xl mx-auto px-4 pt-12 pb-8 w-full">
    <div class="text-center max-w-2xl mx-auto space-y-3">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight" id="heroTitle">
        全球 UAP 官方披露進程追蹤器
      </h1>
      <p class="text-slate-400 text-sm sm:text-base leading-relaxed" id="heroSubtitle">
        追蹤官方紀錄，公開每個疑問。穿透帷幕，重歸客觀透明。
      </p>
    </div>

    <!-- 數據統計橫幅 (Metrics Ribbon) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-8">
      <div class="bg-surface border border-surfaceBorder rounded-xl p-4 text-center">
        <div class="text-xs text-slate-400" id="statLabel1">收錄官方公報</div>
        <div class="text-2xl font-bold text-white mt-1" id="statVal1">--</div>
      </div>
      <div class="bg-surface border border-surfaceBorder rounded-xl p-4 text-center">
        <div class="text-xs text-slate-400" id="statLabel2">國會審議法案</div>
        <div class="text-2xl font-bold text-sky-400 mt-1" id="statVal2">--</div>
      </div>
      <div class="bg-surface border border-surfaceBorder rounded-xl p-4 text-center">
        <div class="text-xs text-slate-400" id="statLabel3">可信度級別</div>
        <div class="text-2xl font-bold text-emerald-400 mt-1">Tier-1</div>
      </div>
      <div class="bg-surface border border-surfaceBorder rounded-xl p-4 text-center">
        <div class="text-xs text-slate-400" id="statLabel4">最後審計巡檢</div>
        <div class="text-sm font-semibold text-slate-300 mt-2" id="statVal4">--</div>
      </div>
    </div>
  </section>

  <!-- 時間線主體 -->
  <main class="max-w-5xl mx-auto px-4 py-6 w-full flex-grow">
    <!-- 篩選列 -->
    <div class="flex items-center justify-between border-b border-surfaceBorder pb-4 mb-8">
      <h2 class="text-lg font-bold text-white flex items-center space-x-2" id="timelineHeader">
        <i class="fa-solid fa-timeline text-sky-400"></i>
        <span>最新解密與官方時間線</span>
      </h2>
      <div class="flex space-x-2 text-xs">
        <button onclick="filterRecords('all')" class="filter-btn active px-3 py-1 rounded bg-sky-600 text-white font-medium" data-filter="all">全部</button>
        <button onclick="filterRecords('official_notice')" class="filter-btn px-3 py-1 rounded bg-surface border border-surfaceBorder text-slate-400 hover:text-white" data-filter="official_notice">聯邦公報</button>
        <button onclick="filterRecords('legislation')" class="filter-btn px-3 py-1 rounded bg-surface border border-surfaceBorder text-slate-400 hover:text-white" data-filter="legislation">國會立法</button>
      </div>
    </div>

    <!-- 列表容器 -->
    <div id="timelineContainer" class="relative timeline-line space-y-8 pl-10 sm:pl-12">
      <div class="text-slate-500 text-sm">正在載入官方紀錄...</div>
    </div>
  </main>

  <!-- 頁腳治理聲明 -->
  <footer class="border-t border-surfaceBorder bg-surface/50 mt-16 py-8 text-xs text-slate-500">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div>
        <p class="font-semibold text-slate-400">揭帷 The Veil / Veilwatch OSINT Project</p>
        <p class="mt-1">僅索引美國聯邦公報、國會法案及官方解密檔（Public Domain）。拒絕匿名謠言。</p>
      </div>
      <div class="flex space-x-4">
        <a href="https://www.federalregister.gov" target="_blank" class="hover:underline">Federal Register</a>
        <a href="https://www.congress.gov" target="_blank" class="hover:underline">Congress.gov</a>
        <a href="https://github.com/jackylawck/veil" target="_blank" class="hover:underline">Source Code</a>
      </div>
    </div>
  </footer>

  <script>
    let currentLang = 'zh';
    let allRecords = [];
    let currentFilter = 'all';

    const UI_TEXT = {
      zh: {
        heroTitle: "全球 UAP 官方披露進程追蹤器",
        heroSubtitle: "追蹤官方紀錄，公開每個疑問。穿透帷幕，重歸客觀透明。",
        stat1: "收錄官方公報",
        stat2: "國會審議法案",
        stat3: "可信度級別",
        stat4: "最後審計巡檢",
        timelineHeader: "最新解密與官方時間線",
        viewSource: "官方原始出處 ↗",
        langBtn: "切換為 English",
        shaLabel: "SHA-256 存證"
      },
      en: {
        heroTitle: "Official UAP Disclosure Ledger",
        heroSubtitle: "Official records. Open questions. Tracked in public.",
        stat1: "Federal Notices",
        stat2: "Congress Bills",
        stat3: "Confidence",
        stat4: "Last Audit Run",
        timelineHeader: "Official Timeline Stream",
        viewSource: "Official Document ↗",
        langBtn: "切換為 繁體中文",
        shaLabel: "SHA-256 Verified"
      }
    };

    // 依序嘗試多個數據來源路徑，確保本地與發布環境皆能正確載入
    async function loadData() {
      const endpoints = [
        './data/records.json',
        './api/records-latest.json',
        './drafts/2026-09-20.json'
      ];

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            allRecords = await res.json();
            break;
          }
        } catch (err) {
          // 嘗試下一個來源
        }
      }

      // 若皆未獲取，採用內置基準官方數據（2024-11-08 DoD 官方 AARO 公告）
      if (!allRecords || allRecords.length === 0) {
        allRecords = [
          {
            id: "FR-2024-26343",
            type: "official_notice",
            date: { val: "2024-11-08", precision: "day" },
            governance: { source_tier: "Tier-1", evidence_level: "official_document" },
            entities: { agencies: ["Department of Defense", "Office of the Secretary"] },
            content: {
              en: {
                title: "Proposed Collection; Comment Request: All-Domain Anomaly Resolution Office (AARO)",
                executive_summary: "Department of Defense notice regarding public information collection, secure reporting procedures, and data repository integrity under Title 10 provisions."
              },
              zh_hk: {
                title: "擬議資訊收集與意見徵詢：全領域異常解決辦公室 (AARO) 專項業務公告",
                executive_summary: "美國國防部正式發布關於設立 UAP 官方通報途徑、目擊數據安全存檔與資訊徵詢機制之法定程序通告。"
              }
            },
            sources: [
              {
                label: "Federal Register Doc #2024-26343",
                url: "https://www.federalregister.gov/documents/2024/11/08/2024-26343/proposed-collection-comment-request",
                sha256: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
              }
            ]
          }
        ];
      }

      updateStats();
      renderTimeline();
    }

    function updateStats() {
      document.getElementById('statVal1').innerText = allRecords.filter(r => r.type === 'official_notice').length;
      document.getElementById('statVal2').innerText = allRecords.filter(r => r.type === 'legislation').length;
      document.getElementById('statVal4').innerText = new Date().toISOString().split('T')[0];
    }

    function renderTimeline() {
      const container = document.getElementById('timelineContainer');
      container.innerHTML = '';

      const filtered = currentFilter === 'all' ? allRecords : allRecords.filter(r => r.type === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="text-slate-500 text-sm">此分類下暫無官方紀錄。</div>';
        return;
      }

      filtered.forEach(record => {
        const isNotice = record.type === 'official_notice';
        const typeBadge = isNotice 
          ? `<span class="bg-emerald-950 text-emerald-400 border border-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">聯邦公報 NOTICE</span>`
          : `<span class="bg-sky-950 text-sky-400 border border-sky-800 text-[10px] font-bold px-2 py-0.5 rounded">國會法案 BILL</span>`;

        const title = currentLang === 'zh' ? (record.content?.zh_hk?.title || record.content?.en?.title || '') : (record.content?.en?.title || '');
        const subTitle = currentLang === 'zh' ? (record.content?.en?.title || '') : '';
        const summary = currentLang === 'zh' ? (record.content?.zh_hk?.executive_summary || record.content?.en?.executive_summary || '') : (record.content?.en?.executive_summary || '');

        const agencies = (record.entities?.agencies || []).map(a => `<span class="text-slate-400 text-xs bg-obsidian px-2 py-0.5 rounded border border-surfaceBorder">${a}</span>`).join(' ');
        const primarySource = record.sources?.[0] || {};
        const shaShort = primarySource.sha256 ? primarySource.sha256.substring(0, 10) + '...' : null;

        const cardHTML = `
          <div class="relative group">
            <div class="absolute -left-[49px] top-1.5 w-4 h-4 rounded-full bg-surface border-2 border-sky-500 group-hover:bg-sky-400 transition"></div>
            
            <div class="bg-surface border border-surfaceBorder hover:border-slate-600 transition rounded-xl p-5 shadow-lg">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                <div class="flex items-center space-x-2">
                  ${typeBadge}
                  <span class="text-xs font-mono text-slate-400">${record.date?.val || ''}</span>
                </div>
                <div class="flex items-center space-x-2">
                  ${shaShort ? `<span class="text-[10px] font-mono text-slate-500 bg-obsidian px-1.5 py-0.5 rounded border border-surfaceBorder" title="SHA-256: ${primarySource.sha256}"><i class="fa-solid fa-fingerprint mr-1"></i>${shaShort}</span>` : ''}
                  <span class="text-[11px] text-slate-500 font-mono">${record.id}</span>
                </div>
              </div>

              <h3 class="text-base sm:text-lg font-bold text-white group-hover:text-sky-300 transition leading-snug">
                ${title}
              </h3>
              ${subTitle && subTitle !== title ? `<p class="text-xs text-slate-500 mt-1 italic">${subTitle}</p>` : ''}

              <p class="text-xs sm:text-sm text-slate-300 mt-3 leading-relaxed">
                ${summary}
              </p>

              <div class="mt-4 pt-3 border-t border-surfaceBorder/60 flex flex-wrap items-center justify-between gap-3">
                <div class="flex flex-wrap gap-1.5">
                  ${agencies}
                </div>
                <a href="${primarySource.url || '#'}" target="_blank" class="text-xs font-semibold text-sky-400 hover:text-sky-300 flex items-center space-x-1">
                  <span>${UI_TEXT[currentLang].viewSource}</span>
                </a>
              </div>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
      });
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      document.getElementById('heroTitle').innerText = UI_TEXT[currentLang].heroTitle;
      document.getElementById('heroSubtitle').innerText = UI_TEXT[currentLang].heroSubtitle;
      document.getElementById('statLabel1').innerText = UI_TEXT[currentLang].stat1;
      document.getElementById('statLabel2').innerText = UI_TEXT[currentLang].stat2;
      document.getElementById('statLabel3').innerText = UI_TEXT[currentLang].stat3;
      document.getElementById('statLabel4').innerText = UI_TEXT[currentLang].stat4;
      document.getElementById('timelineHeader').querySelector('span').innerText = UI_TEXT[currentLang].timelineHeader;
      document.getElementById('langToggleBtn').innerText = UI_TEXT[currentLang].langBtn;
      renderTimeline();
    }

    function filterRecords(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.dataset.filter === type) {
          btn.className = "filter-btn active px-3 py-1 rounded bg-sky-600 text-white font-medium";
        } else {
          btn.className = "filter-btn px-3 py-1 rounded bg-surface border border-surfaceBorder text-slate-400 hover:text-white";
        }
      });
      renderTimeline();
    }

    // 初始化載入
    loadData();
  </script>
</body>
</html>
