name: 99. Diagnostics Probe (FR)

on:
  workflow_dispatch:

jobs:
  run-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Diagnostics Probe
        run: python scripts/probe_fr.py
