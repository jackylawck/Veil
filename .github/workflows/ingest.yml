def run_ingestion(days_back: int = 36500) -> None:
  """執行全量情報攝入。

  包含錯誤隔離保護、ID 衝突去重、健康度統計以及 SHA-256 簽署。
  """
  start_time = datetime.now(timezone.utc)
  print(
      f"[{start_time.isoformat()}] 啟動全量情報攝入 (時間窗口: {days_back}"
      " 日 / 全歷史)..."
  )

  all_records: List[Dict[str, Any]] = []
  seen_ids = set()
  adapter_metrics: List[Dict[str, Any]] = []
  failed_adapters: List[Dict[str, str]] = []

  # 逐個執行適配器，進行嚴格錯誤隔離
  for adapter_cls in ALL_ADAPTERS:
    adapter_name = adapter_cls.__name__
    try:
      adapter = adapter_cls()
      adapter_name = adapter.source_name
      fetched = adapter.fetch_records(days_back=days_back)

      new_count = 0
      for r in fetched:
        r_id = r.get("id")
        if r_id and r_id not in seen_ids:
          seen_ids.add(r_id)
          all_records.append(r)
          new_count += 1

      adapter_metrics.append({
          "adapter": adapter_name,
          "status": "success",
          "records_fetched": len(fetched),
          "records_ingested": new_count,
      })
      print(f"  ✔ [{adapter_name:<28}] 成功載入 {new_count} 筆記錄")

    except Exception as exc:
      err_msg = str(exc)
      failed_adapters.append({"adapter": adapter_name, "error": err_msg})
      print(
          f"  ✖ [{adapter_name:<28}] 執行失敗，已觸發錯誤隔離: {err_msg}",
          file=sys.stderr,
      )

  # 按日期降序排序 (最新在最前)
  all_records.sort(
      key=lambda x: x.get("date", {}).get("val", "1900-01-01"), reverse=True
  )

  end_time = datetime.now(timezone.utc)
  execution_duration = round((end_time - start_time).total_seconds(), 2)

  # 構建 Ledger 主輸出結構
  output_data = {
      "metadata": {
          "title": (
              "The Veil - Global Declassified & Sovereign UAP Intelligence"
              " Ledger"
          ),
          "zh_title": "揭帷 - 全球主權防衛與官方解密情報總帳",
          "generated_at": end_time.isoformat(),
          "execution_duration_sec": execution_duration,
          "total_records": len(all_records),
          "adapters_registered": len(ALL_ADAPTERS),
          "adapters_succeeded": len(adapter_metrics),
          "adapters_failed": len(failed_adapters),
          "ingestion_policy": "fault_tolerant_historical_retention",
          "retention_window_days": days_back,
      },
      "health_report": {
          "failed_count": len(failed_adapters),
          "failures": failed_adapters,
      },
      "records": all_records,
  }

  # 定位輸出路徑 (public/api/)
  out_dir = Path(__file__).resolve().parent.parent / "public" / "api"
  out_dir.mkdir(parents=True, exist_ok=True)

  out_file = out_dir / "records-latest.json"
  sha_file = out_dir / "records-latest.json.sha256"

  # 寫入 JSON 主檔
  json_bytes = json.dumps(output_data, ensure_ascii=False, indent=2).encode(
      "utf-8"
  )
  out_file.write_bytes(json_bytes)

  # 計算並寫入 SHA-256 數位存證雜湊
  sha256_hash = hashlib.sha256(json_bytes).hexdigest()
  sha_file.write_text(f"{sha256_hash}  records-latest.json\n", encoding="utf-8")

  # 終端總結報告
  print("\n" + "=" * 65)
  print(f" 數據入庫完成！總記錄數: {len(all_records)} 筆 (耗時: {execution_duration}s)")
  print(
      f" 適配器健康度: 成功 {len(adapter_metrics)} / 失敗"
      f" {len(failed_adapters)} (共 {len(ALL_ADAPTERS)} 個)"
  )
  print(f" 主端點生成: {out_file}")
  print(f" SHA-256: {sha256_hash}")
  print("=" * 65)

  # 邊界防禦：若所有適配器全數崩潰（記錄數為 0），則拋出異常阻斷發布
  if len(all_records) == 0 and len(failed_adapters) > 0:
    print(
        "❌ 嚴重警報: 全部適配器執行失敗，中止構建以防覆蓋正常資料！",
        file=sys.stderr,
    )
    sys.exit(1)


if __name__ == "__main__":
  days = 36500
  if len(sys.argv) > 1:
    try:
      days = int(sys.argv[1])
    except ValueError:
      pass
  run_ingestion(days_back=days)
