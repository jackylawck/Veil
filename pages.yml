name: Deploy Veilwatch to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'public/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Public Directory & JSON Integrity
        run: |
          # 檢查目錄與首頁 HTML
          if [ ! -d "public" ] || [ ! -f "public/index.html" ]; then
            echo "::error::找不到 public 目錄或 public/index.html！"
            exit 1
          fi

          # 檢查 API 端點 JSON 格式合法性（防壞版發布）
          LEDGER_PATH="public/api/records-latest.json"
          if [ -f "$LEDGER_PATH" ]; then
            python3 -m json.tool "$LEDGER_PATH" > /dev/null
            echo "records-latest.json 語法驗證通過"
          fi

          # 確保建立 .nojekyll
          touch public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
